version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_agent
      POSTGRES_USER: ai_agent
      POSTGRES_PASSWORD: ai_agent
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/sql:/docker-entrypoint-initdb.d

  backend:
    build:
      context: ./apps/backend
    env_file:
      - ./apps/backend/.env.example
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./apps/frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pg_data:
