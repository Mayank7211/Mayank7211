name: Reranker & Retrieval Eval Smoke

on:
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/backend/requirements.txt
      - name: Run tests
        run: |
          python -m pytest -q apps/backend/tests || true
      - name: Run reranker demo
        run: |
          python tools/run_reranker_demo.py --in data/retrieval_dataset/labels.csv
      - name: Run retrieval eval smoke
        run: |
          python tools/run_retrieval_eval_full.py --labels data/retrieval_dataset/labels.csv --k 3
