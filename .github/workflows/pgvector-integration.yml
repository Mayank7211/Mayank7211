name: PgVector Integration Tests
on:
  workflow_dispatch: {}

jobs:
  pgvector-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ankane/pgvector:latest
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb -h localhost -p 5432"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/backend/requirements.txt || true
          pip install pytest sqlalchemy asyncpg psycopg[binary]

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d testdb -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run pgvector integration tests
        env:
          AI_AGENT_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/testdb
        run: |
          pytest apps/backend/tests/test_pgvector_integration.py -q
